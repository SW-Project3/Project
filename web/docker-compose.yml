version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-system-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - trading-network
    restart: unless-stopped

  flask-backend:
    build:
      context: ..
      dockerfile: ./web/backend-flask/Dockerfile
    container_name: trading-system-flask-backend
    ports:
      - "5000:5000"
    volumes:
      - ../data:/app/data:ro
      - ../main:/app/main:ro
      - ../data_process:/app/data_process:ro
    networks:
      - trading-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-system-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - flask-backend
    networks:
      - trading-network
    restart: unless-stopped

networks:
  trading-network:
    driver: bridge

